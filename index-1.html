@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1712;--fg:#e8f2ec;--card:#16241c;--mut:#9db0a5;--bd:#25382d}}
:root[data-theme=dark]{--bg:#0e1712;--fg:#e8f2ec;--card:#16241c;--mut:#9db0a5;--bd:#25382d}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans Bengali',system-ui,sans-serif;padding-bottom:78px}
main{max-width:760px;margin:auto;padding:14px}
h1{margin:0;font-size:24px}h2{font-size:17px;margin:20px 0 8px}
.top{background:linear-gradient(135deg,var(--g),#0a8a66);color:#fff;border-radius:20px;padding:18px;position:relative}
.top:after{content:"";position:absolute;right:18px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--r)}
.top p{margin:4px 0 0;opacity:.9;font-size:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;transition:.2s}
button{font:inherit;color:inherit;cursor:pointer}
.reg{border-left:6px solid;text-align:left;font-weight:700;background:var(--card);border-radius:16px;border-top:1px solid var(--bd);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:14px}
.reg small{display:block;color:var(--mut);font-weight:400}
.reg.on{transform:scale(1.03);box-shadow:0 4px 14px #0003}
.map{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:8px}
.t{aspect-ratio:1;border:0;border-radius:8px;font-size:clamp(7px,2.2vw,11px);line-height:1.1;padding:1px;color:#fff;font-weight:600;transition:.15s;overflow:hidden}
.t:hover,.t:active{transform:scale(1.25);z-index:2}.t.dim{opacity:.18}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:8px}
.seg .on{background:var(--g);color:#fff}
.note{font-size:12px;color:var(--mut);background:var(--card);border-radius:12px;padding:8px 10px;margin-top:8px}
.chip{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:5px 11px;margin:3px;font-size:13px}
input{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:10px 0;font-size:12px;color:var(--mut)}nav .on{color:var(--g);font-weight:700}
nav span{display:block;font-size:20px}
#sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.open{display:flex}
#sh{background:var(--bg);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:18px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.foot{text-align:center;font-size:11px;color:var(--mut);margin:26px 0 6px;opacity:.8}
a{color:var(--g);font-weight:700}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.ok{background:#1b9a5f;color:#fff}.no{background:var(--r);color:#fff}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}textarea,select{width:100%;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
